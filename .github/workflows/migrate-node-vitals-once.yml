name: Migrate NodeVitals Once

on:
  push:
    paths:
      - '.github/workflows/migrate-node-vitals-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build centered NodeVitals widget
        run: python scripts/migrate_node_vitals_once.py

      - name: Replace old NodePulse and clean temporary files
        run: |
          git rm Egern/Widget/NodePulse/NodePulse.js Egern/Widget/NodePulse/NodePulse.yaml
          git rm .github/workflows/migrate-node-vitals-once.yml scripts/migrate_node_vitals_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/NodeVitals/NodeVitals.js Egern/Widget/NodeVitals/NodeVitals.yaml
          git commit -m "feat: migrate centered NodeVitals widget"
          git push
