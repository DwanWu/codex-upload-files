name: Sync Egern Huangli calendar
on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Beijing
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_huangli.mjs'
      - '.github/workflows/sync-huangli.yml'
permissions:
  contents: write
concurrency:
  group: egern-huangli-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh, test and publish verified calendar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync_huangli.mjs
            node scripts/test_egern_widgets.mjs
            git add -- Egern/Widget/DailyHuangli/DailyHuangli.js
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Sync verified Huangli calendar bundle'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
