name: Fix GasPrice header once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore original GasPrice header alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('Egern/Widget/GasPrice.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace("mkIcon('fuelpump.fill'", "mkIcon('fuelpump.circle.fill'")
          js.write_text(text, encoding='utf-8')

          yml = Path('Egern/Widget/GasPrice.yaml')
          y = yml.read_text(encoding='utf-8')
          y = y.replace('GasPrice.js?v=20260908-1', 'GasPrice.js?v=20260908-2')
          yml.write_text(y, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-gasprice-header-once.yml

      - name: Commit precise fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/GasPrice.js Egern/Widget/GasPrice.yaml .github/workflows/fix-gasprice-header-once.yml
          git commit -m "fix: restore GasPrice header alignment"
          git push
