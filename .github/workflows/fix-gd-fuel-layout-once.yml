name: Fix GDFuelPrice Layout Once

on:
  push:
    paths:
      - '.github/workflows/fix-gd-fuel-layout-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply layout repair
        run: python scripts/fix_gd_fuel_layout_once.py

      - name: Commit repaired widget and clean temporary files
        run: |
          git rm .github/workflows/fix-gd-fuel-layout-once.yml scripts/fix_gd_fuel_layout_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/GDFuelPrice/GDFuelPrice.js Egern/Widget/GDFuelPrice/GDFuelPrice.yaml
          git commit -m "fix: repair centered GDFuelPrice layout"
          git push
