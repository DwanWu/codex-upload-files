name: Patch Guangdong Oil NiuMa Layout Once

on:
  push:
    paths:
      - '.github/workflows/patch-guangdong-oil-niuma-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply layout patch
        run: python scripts/patch_guangdong_oil_niuma_layout.py

      - name: Commit changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_guangdong_oil_niuma_layout.py .github/workflows/patch-guangdong-oil-niuma-once.yml
          git add Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.js Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.yaml
          git commit -m "fix: align Guangdong oil layout with NiuMa widget"
          git push
