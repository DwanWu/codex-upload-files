name: Update 牛马消息

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: niuma-digest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update 牛马消息 data
        run: python scripts/update_niuma_digest.py

      - name: Commit changes
        run: |
          if git diff --quiet -- Egern/Widget/NiuMaDigest/NiuMaDigest.json; then
            echo "No 牛马消息 changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/NiuMaDigest/NiuMaDigest.json
          git commit -m "chore: update 牛马消息"
          git push
