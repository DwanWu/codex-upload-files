name: Update 牛马消息

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/niuma-digest.yml"
      - "scripts/update_niuma_digest.py"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: niuma-digest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update 牛马消息 data
        run: python scripts/update_niuma_digest.py

      - name: Commit changes safely
        run: |
          if git diff --quiet -- Egern/Widget/NiuMaDigest/NiuMaDigest.json; then
            echo "No 牛马消息 changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/NiuMaDigest/NiuMaDigest.json
          git commit -m "chore: update 牛马消息"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed; will retry"
            elif git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Failed to push 牛马消息 update after 3 attempts"
          exit 1
