name: Cleanup Actions History Once

on:
  push:
    paths:
      - '.github/workflows/cleanup-actions-history-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete obsolete workflow runs
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path] | @tsv' > /tmp/runs.tsv

          while IFS=$'\t' read -r run_id run_path; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            [ "$run_path" = ".github/workflows/niuma-digest.yml" ] && continue
            echo "Deleting run $run_id ($run_path)"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
          done < /tmp/runs.tsv

      - name: Remove this one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/cleanup-actions-history-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time Actions history cleanup"
          git push

      - name: Remove this cleanup run if possible
        if: always()
        shell: bash
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
