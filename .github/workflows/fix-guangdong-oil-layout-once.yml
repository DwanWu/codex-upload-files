name: Fix Guangdong Oil Layout Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-guangdong-oil-layout-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust layout
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.js')
          s = js_path.read_text(encoding='utf-8')

          replacements = {
              "type: 'widget', padding: [12, 12, 8, 12], url: BASE, backgroundGradient,": "type: 'widget', padding: [8, 12, 8, 12], url: BASE, backgroundGradient,",
              "type: 'widget', padding: [16, 16, 14, 16], url: BASE, backgroundGradient,": "type: 'widget', padding: [10, 16, 14, 16], url: BASE, backgroundGradient,",
              "type: 'widget', padding: [10, 12, 6, 12], url: BASE, backgroundGradient,": "type: 'widget', padding: [4, 12, 6, 12], url: BASE, backgroundGradient,",
              "      mkSpacer(24),\n      mkRow(PRICE_ITEMS.map(item => buildPriceCard(item, cardCfgMed)), 6),\n      mkSpacer(15),": "      mkSpacer(),\n      mkRow(PRICE_ITEMS.map(item => buildPriceCard(item, cardCfgMed)), 6),\n      mkSpacer(),",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected layout pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)
          js_path.write_text(s, encoding='utf-8')

          yaml_path = Path('Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.yaml')
          y = yaml_path.read_text(encoding='utf-8')
          if '?v=20260908-1' in y:
              y = y.replace('?v=20260908-1', '?v=20260908-2')
          elif 'GuangdongOilPrice.js?v=' in y:
              import re
              y = re.sub(r'GuangdongOilPrice\.js\?v=[^\s]+', 'GuangdongOilPrice.js?v=20260908-2', y)
          else:
              y = y.replace('GuangdongOilPrice.js', 'GuangdongOilPrice.js?v=20260908-2')
          yaml_path.write_text(y, encoding='utf-8')
          PY

          rm .github/workflows/fix-guangdong-oil-layout-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.js Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.yaml .github/workflows/fix-guangdong-oil-layout-once.yml
          git commit -m "fix: align Guangdong oil price layout"
          git push
