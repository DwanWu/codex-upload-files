name: Sync complete Other rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-other-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build other rules from complete proxy rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Egern/Rules /tmp/egern-rules
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/proxy.yaml' -o /tmp/egern-rules/proxy.yaml
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/apple.yaml' -o /tmp/egern-rules/apple.yaml
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/apple-cn.yaml' -o /tmp/egern-rules/apple-cn.yaml
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/apple-proxy.yaml' -o /tmp/egern-rules/apple-proxy.yaml
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/apple-tv.yaml' -o /tmp/egern-rules/apple-tv.yaml
          curl -fsSL 'https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/egern/apns.yaml' -o /tmp/egern-rules/apns.yaml

          python3 <<'PY'
          from pathlib import Path

          source = Path('/tmp/egern-rules/proxy.yaml')
          category_files = [
              Path('Egern/Rules/chatgpt.yaml'),
              Path('Egern/Rules/google.yaml'),
              Path('Egern/Rules/claude.yaml'),
              Path('/tmp/egern-rules/apple.yaml'),
              Path('/tmp/egern-rules/apple-cn.yaml'),
              Path('/tmp/egern-rules/apple-proxy.yaml'),
              Path('/tmp/egern-rules/apple-tv.yaml'),
              Path('/tmp/egern-rules/apns.yaml'),
          ]
          output = Path('Egern/Rules/other.yaml')

          section_names = {
              'domain_set',
              'domain_suffix_set',
              'domain_keyword_set',
              'domain_regex_set',
              'ip_cidr_set',
              'ip_cidr6_set',
              'asn_set',
              'url_regex_set',
              'process_name_set',
          }

          # Keep common proxy-node/IP purity/leak test sites in this aggregate.
          # Keywords are intentional so related subdomains/API hosts are covered too.
          custom_ip_test_keywords = {
              'ippure',
              'ping0',
              'ipinfo',
              'ipify',
              'ipapi',
              'iplocation',
              'ip2location',
              'whoer',
              'ipleak',
              'dnsleaktest',
              'browserleaks',
              'scamalytics',
              'ipqualityscore',
              'iphey',
              'pixelscan',
              'iprobe',
              'ipcheck',
          }

          def parse_rules(path):
              result = {name: set() for name in section_names}
              if not path.exists():
                  return result
              current = None
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  if line.endswith(':') and not line.startswith('-'):
                      key = line[:-1].strip()
                      current = key if key in section_names else None
                      continue
                  if current and line.startswith('- '):
                      result[current].add(line[2:].strip())
              return result

          excluded = {name: set() for name in section_names}
          for file in category_files:
              parsed = parse_rules(file)
              for section, values in parsed.items():
                  excluded[section].update(values)

          lines = source.read_text(encoding='utf-8').splitlines()
          out = []
          current = None
          removed = 0
          existing = {name: set() for name in section_names}
          for raw in lines:
              stripped = raw.strip()
              if stripped.endswith(':') and not stripped.startswith('-'):
                  key = stripped[:-1].strip()
                  current = key if key in section_names else None
                  out.append(raw)
                  continue
              if current and stripped.startswith('- '):
                  value = stripped[2:].strip()
                  if value in excluded[current]:
                      removed += 1
                      continue
                  existing[current].add(value)
              out.append(raw)

          # Insert custom test-site keywords into domain_keyword_set. If the source
          # ever lacks that section, append a valid section at the end.
          missing = sorted(custom_ip_test_keywords - existing['domain_keyword_set'])
          if missing:
              try:
                  idx = next(i for i, line in enumerate(out) if line.strip() == 'domain_keyword_set:')
                  insert_at = idx + 1
                  while insert_at < len(out) and (out[insert_at].lstrip().startswith('- ') or not out[insert_at].strip()):
                      insert_at += 1
                  out[insert_at:insert_at] = [f'- {value}' for value in missing]
              except StopIteration:
                  if out and out[-1].strip():
                      out.append('')
                  out.append('domain_keyword_set:')
                  out.extend(f'- {value}' for value in missing)

          header = [
              '# Complete OTHER proxy rules for Egern',
              '# Source: QuixoticHeart/rule-set egern/proxy.yaml',
              '# Excludes rules already assigned to chatgpt.yaml, google.yaml and claude.yaml.',
              '# Excludes Apple rules from apple, apple-cn, apple-proxy, apple-tv and apns.',
              '# Adds common IP/proxy node test sites as domain keywords.',
              '# Includes common overseas services/sites and other AI services.',
              '',
          ]
          output.write_text('\n'.join(header + out) + '\n', encoding='utf-8')
          print(f'Generated {output}; removed {removed} excluded rules; ensured {len(custom_ip_test_keywords)} IP-test keywords.')
          PY

      - name: Commit synced rules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Egern/Rules/other.yaml
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Sync complete Other Egern rules'
            git push
          fi
