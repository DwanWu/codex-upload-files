name: Update AI Release Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 feedparser

      - name: Update release data
        run: python scripts/update_ai_releases.py

      - name: Commit changes
        run: |
          if git diff --quiet -- Egern/Widget/AIReleaseRadar.json; then
            echo "No release changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/AIReleaseRadar.json
          git commit -m "chore: update release radar"
          git push
