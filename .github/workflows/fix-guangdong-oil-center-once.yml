name: Center Guangdong Oil Layout Once

on:
  push:
    paths:
      - '.github/workflows/fix-guangdong-oil-center-once.yml'

permissions:
  contents: write

jobs:
  center-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply centered layout
        run: python scripts/center_guangdong_oil_once.py

      - name: Remove temporary files and commit
        run: |
          git rm .github/workflows/fix-guangdong-oil-center-once.yml scripts/center_guangdong_oil_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.js Egern/Widget/GuangdongOilPrice/GuangdongOilPrice.yaml
          git commit -m "fix: center Guangdong oil price widget content"
          git push
