name: Mirror Egern tag module

on:
  schedule:
    - cron: '11 5 * * *' # 13:11 Beijing time daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egern-tag-module-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download and validate without executing module
        run: python3 scripts/sync_tag_module.py "$RUNNER_TEMP/tag.sgmodule"
      - name: Publish changed content only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p Egern/Module
            cp "$RUNNER_TEMP/tag.sgmodule" Egern/Module/tag.sgmodule
            git add -- Egern/Module/tag.sgmodule
            if git diff --cached --quiet; then
              echo 'Module unchanged.'
              exit 0
            fi
            git commit -m 'Sync upstream Egern tag module'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
