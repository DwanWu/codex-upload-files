# ==========================================
# 📌 模块名称: 节点体检
# 🟢 图标: 绿色盾牌
# ✨ 顶部: 节点体检 + 地区
# ✨ 中间: 纯度 / 属性 / 风险 在可用区域垂直居中
# ✨ 底部: 左侧内网 IP / 右侧出口 IP
# ==========================================

name: "节点体检"
description: "节点体检：以同一实际出口为基准，Proxycheck v3主评分、IPPure IPv4明确标注降级、IPQuery辅助核验；支持IPv4/IPv6，不混算评分，不虚构纯度。"

auto_update:
  interval: 1800

scriptings:
  - generic:
      name: 节点体检
      # 可选本机私有 env：NODE_POLICY 为实际策略组名；PROXYCHECK_KEY 为自己的密钥。不要提交密钥。
      # 匿名接口可能拒绝代理来源，失败时自动降级为 IPPure。
      timeout: 15
      update_interval: 1800
      script_url: https://raw.githubusercontent.com/DwanWu/codex-upload-files/main/Egern/Widget/NodeVitals/NodeVitals.js?v=20261127-6

widgets:
  - name: 节点体检
    script_name: 节点体检
