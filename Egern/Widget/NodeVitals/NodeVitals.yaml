# ==========================================
# 📌 模块名称: 节点体检
# 🟢 图标: 绿色盾牌
# ✨ 顶部: 节点体检 + 地区
# ✨ 中间: 纯度 / 属性 / 风险 在可用区域垂直居中
# ✨ 底部: 左侧内网 IP / 右侧出口 IP
# ==========================================

name: "节点体检"
description: "节点体检居中布局：顶部标题固定，中间纯度/属性/风险结果在可用区域垂直居中，底部显示内网与本次实际出口 IP；IPPure 获取实际出口及原始风险系数，IPv4纯度仅按100−IPPure风险值计算并标记参考；IPv6或原始评分缺失时不伪造分数。IPQuery仅辅助同IP风险及属性。"

auto_update:
  interval: 1800

scriptings:
  - generic:
      name: 节点体检
      # 可选：env: { NODE_POLICY: "实际策略组名称" }，默认遵循当前分流规则。
      timeout: 15
      update_interval: 1800
      script_url: https://raw.githubusercontent.com/DwanWu/codex-upload-files/main/Egern/Widget/NodeVitals/NodeVitals.js?v=20261127-5

widgets:
  - name: 节点体检
    script_name: 节点体检
