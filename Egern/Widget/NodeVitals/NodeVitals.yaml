# ==========================================
# 📌 模块名称: 节点体检
# 🟢 图标: 绿色盾牌
# ✨ 顶部: 节点体检 + 地区
# ✨ 中间: 纯度 / 属性 / 风险 在可用区域垂直居中
# ✨ 底部: 左侧内网 IP / 右侧出口 IP
# ==========================================

name: "节点体检"
description: "节点体检：按同一出口 IP 查询真实风险，纯度为有效原始风险的反向参考分。有效零分正常显示，接口失败不填满分；可在模块设置指定检测策略。"

env_schema:
  NODE_POLICY:
    name: 检测策略
    description: 填写要检测的节点或策略组完整名称；留空不指定策略，不能保证跟随所选节点。
  PROXYCHECK_KEY:
    name: Proxycheck 密钥
    description: 可选，填写自己的 API 密钥；留空使用匿名查询。

auto_update:
  interval: 1800

scriptings:
  - generic:
      name: 节点体检
      # 在模块设置填写上述环境变量，无需编辑或上传带密钥的远程脚本。
      # 匿名接口可能拒绝代理来源，失败时自动降级为 IPPure。
      timeout: 30
      update_interval: 1800
      script_url: https://raw.githubusercontent.com/DwanWu/codex-upload-files/main/Egern/Widget/NodeVitals/NodeVitals.js?v=20261127-9

widgets:
  - name: 节点体检
    script_name: 节点体检

