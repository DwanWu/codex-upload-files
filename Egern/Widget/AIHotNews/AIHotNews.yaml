# ==========================================
# 📌 模块名称: 智能热搜
# 🔥 数据来源: AIHOT 官方 REST API v1
# ✨ 主榜: 当前 AI 热点 Top 10 官方标题
# 🧭 补足: 过去 24 小时 AIHOT 精选与动态
# 🔄 刷新: Widget 约 15 分钟请求刷新
# ==========================================

name: "智能热搜"
description: "v2.0 · 直接展示 AIHOT 官方原始标题，小号/中号5条、大号8条，单行自适应字号；过长或原文含省略号的标题顺延补足。不请求摘要详情，保留ETag、限流退避与6小时缓存。"

auto_update:
  interval: 1800

scriptings:
  - generic:
      name: 智能热搜
      script_url: https://raw.githubusercontent.com/DwanWu/codex-upload-files/main/Egern/Widget/AIHotNews/AIHotNews.js?v=2.0&rev=20261127-9
      update_interval: 1800
      timeout: 35

widgets:
  - name: 智能热搜
    script_name: 智能热搜
