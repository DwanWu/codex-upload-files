# Anthropic / Claude routing rules for Egern
# Current Anthropic official inbound/outbound ranges; phased-out addresses excluded
# https://platform.claude.com/docs/en/api/ip-addresses
# Dedicated cloud endpoints are matched by domain, not all cloud-provider addresses.
no_resolve: true

domain_set:
- "anthropic-com.ghost.io"
- "anthropic.com.cdn.cloudflare.net"
- "cdn.growthbook.io"
- "cdn.usefathom.com"
- "claude.googleapis.com"
- "code.claude.com"
- "platform.claude.com"
- "servd-anthropic-website.b-cdn.net"

domain_suffix_set:
- "anthropic.com"
- "anthropic.team"
- "antspace.dev"
- "clau.de"
- "claude.ai"
- "claude.app"
- "claude.com"
- "claude.dev"
- "claude.new"
- "claude.site"
- "claudemcpclient.com"
- "claudemcpcontent.com"
- "claudepages.dev"
- "claudeusercontent.com"
- "modelcontextprotocol.com"
- "modelcontextprotocol.io"
- "modelcontextprotocol.net"
- "modelcontextprotocol.org"

domain_keyword_set:
- "anthropic"
- "claude"

domain_wildcard_set:
- "aws-external-anthropic.*.api.aws"

ip_cidr_set:
- 153.61.208.0/20
- 153.61.224.0/22
- 160.79.104.0/21
- 160.79.104.0/23

ip_cidr6_set:
- 2607:6bc0::/48
