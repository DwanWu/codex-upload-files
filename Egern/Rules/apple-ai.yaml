# Apple Intelligence / Siri / Search proxy targets for Egern
# Source: https://support.apple.com/en-us/101555
# Section: Apple Intelligence, Siri, and Search
# Assign this rule set to a PROXY node/group before broad Apple DIRECT,
# Other and GEOIP rules. No policy is embedded in a rule-set file.
# Private Cloud Compute uses TCP/UDP 443. Do not enable TLS interception.
# This intentionally does not proxy all apple.com, icloud.com,
# apple-dns.net, fastly-edge.com, App Store downloads or Private Relay.

no_resolve: true

domain_set:
- apple-relay.apple.com
- apple-relay.cloudflare.com
- apple-relay.fastly-edge.com
- cp4.cloudflare.com
- guzzoni.apple.com

domain_suffix_set:
- smoot.apple.com
